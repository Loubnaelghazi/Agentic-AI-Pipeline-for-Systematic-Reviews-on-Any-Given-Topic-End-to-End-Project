<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1190" viewBox="0 0 1000 1190" role="img" aria-labelledby="title desc"><title id="title">PRISMA-oriented search and selection flow</title><desc id="desc">Search, screening, retrieval and eligibility counts. Pending decisions and unavailable reports are distinct from exclusions.</desc><rect width="1000" height="1190" rx="22" fill="#f6f8fc"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4z" fill="#94a3b8"/></marker></defs><text x="45" y="50" fill="#172b4d" font-family="sans-serif" font-size="28" font-weight="700">Search &amp; selection</text><text x="45" y="78" fill="#64748b" font-family="sans-serif" font-size="15">PRISMA-oriented reporting · Automated draft</text><rect x="45" y="115" width="510" height="110" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-opacity="0.35"/><rect x="45" y="132" width="5" height="76" rx="2" fill="#2563eb"/><text x="65" y="144" font-family="sans-serif" font-size="16" font-weight="700" fill="#2563eb">Identification</text><text x="65" y="184" font-family="sans-serif" font-size="32" font-weight="700" fill="#172b4d">61</text><text x="65" y="208" font-family="sans-serif" font-size="13" fill="#475569">Records found across the searched sources</text><rect x="655" y="115" width="300" height="125" rx="14" fill="#f1f5f9" stroke="#475569" stroke-opacity="0.35"/><rect x="655" y="132" width="5" height="91" rx="2" fill="#475569"/><text x="675" y="144" font-family="sans-serif" font-size="16" font-weight="700" fill="#475569">Duplicates removed</text><text x="675" y="184" font-family="sans-serif" font-size="32" font-weight="700" fill="#172b4d">10</text><text x="675" y="208" font-family="sans-serif" font-size="13" fill="#475569">Removed before screening</text><path d="M560,169 L645,169" fill="none" stroke="#94a3b8" stroke-width="2"/><polygon points="645.00,169.00 636.00,165.00 636.00,173.00" fill="#94a3b8"/><rect x="45" y="280" width="510" height="110" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-opacity="0.35"/><rect x="45" y="297" width="5" height="76" rx="2" fill="#7c3aed"/><text x="65" y="309" font-family="sans-serif" font-size="16" font-weight="700" fill="#7c3aed">Titles &amp; abstracts</text><text x="65" y="349" font-family="sans-serif" font-size="32" font-weight="700" fill="#172b4d">51</text><text x="65" y="373" font-family="sans-serif" font-size="13" fill="#475569">Records examined for relevance</text><rect x="655" y="280" width="300" height="125" rx="14" fill="#f1f5f9" stroke="#475569" stroke-opacity="0.35"/><rect x="655" y="297" width="5" height="91" rx="2" fill="#475569"/><text x="675" y="309" font-family="sans-serif" font-size="16" font-weight="700" fill="#475569">Screening exclusions</text><text x="675" y="349" font-family="sans-serif" font-size="32" font-weight="700" fill="#172b4d">0</text><text x="675" y="373" font-family="sans-serif" font-size="13" fill="#475569">Excluded at title / abstract</text><text x="675" y="390" font-family="sans-serif" font-size="13" fill="#475569">review</text><path d="M560,334 L645,334" fill="none" stroke="#94a3b8" stroke-width="2"/><polygon points="645.00,334.00 636.00,330.00 636.00,338.00" fill="#94a3b8"/><rect x="45" y="445" width="510" height="110" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-opacity="0.35"/><rect x="45" y="462" width="5" height="76" rx="2" fill="#0f766e"/><text x="65" y="474" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f766e">Full-text retrieval</text><text x="65" y="514" font-family="sans-serif" font-size="32" font-weight="700" fill="#172b4d">38</text><text x="65" y="538" font-family="sans-serif" font-size="13" fill="#475569">Full texts available · 51 sought</text><rect x="655" y="445" width="300" height="125" rx="14" fill="#fffbeb" stroke="#b45309" stroke-opacity="0.35"/><rect x="655" y="462" width="5" height="91" rx="2" fill="#b45309"/><text x="675" y="474" font-family="sans-serif" font-size="16" font-weight="700" fill="#b45309">Full texts unavailable</text><text x="675" y="514" font-family="sans-serif" font-size="32" font-weight="700" fill="#172b4d">13</text><text x="675" y="538" font-family="sans-serif" font-size="13" fill="#475569">Access gaps, not scientific</text><text x="675" y="555" font-family="sans-serif" font-size="13" fill="#475569">exclusions</text><path d="M560,499 L645,499" fill="none" stroke="#94a3b8" stroke-width="2"/><polygon points="645.00,499.00 636.00,495.00 636.00,503.00" fill="#94a3b8"/><rect x="45" y="610" width="510" height="110" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-opacity="0.35"/><rect x="45" y="627" width="5" height="76" rx="2" fill="#7c3aed"/><text x="65" y="639" font-family="sans-serif" font-size="16" font-weight="700" fill="#7c3aed">Eligibility assessment</text><text x="65" y="679" font-family="sans-serif" font-size="32" font-weight="700" fill="#172b4d">38</text><text x="65" y="703" font-family="sans-serif" font-size="13" fill="#475569">Reports checked against the review criteria</text><rect x="655" y="610" width="300" height="125" rx="14" fill="#f1f5f9" stroke="#475569" stroke-opacity="0.35"/><rect x="655" y="627" width="5" height="91" rx="2" fill="#475569"/><text x="675" y="639" font-family="sans-serif" font-size="16" font-weight="700" fill="#475569">Full-text exclusions</text><text x="675" y="679" font-family="sans-serif" font-size="32" font-weight="700" fill="#172b4d">1</text><text x="675" y="703" font-family="sans-serif" font-size="13" fill="#475569">Exclusion reasons recorded</text><text x="675" y="720" font-family="sans-serif" font-size="13" fill="#475569">separately</text><path d="M560,664 L645,664" fill="none" stroke="#94a3b8" stroke-width="2"/><polygon points="645.00,664.00 636.00,660.00 636.00,668.00" fill="#94a3b8"/><path d="M300,230 L300,270" fill="none" stroke="#94a3b8" stroke-width="2"/><polygon points="300.00,270.00 304.00,261.00 296.00,261.00" fill="#94a3b8"/><path d="M300,395 L300,435" fill="none" stroke="#94a3b8" stroke-width="2"/><polygon points="300.00,435.00 304.00,426.00 296.00,426.00" fill="#94a3b8"/><path d="M300,560 L300,600" fill="none" stroke="#94a3b8" stroke-width="2"/><polygon points="300.00,600.00 304.00,591.00 296.00,591.00" fill="#94a3b8"/><rect x="45" y="795" width="245" height="125" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-opacity="0.35"/><rect x="45" y="812" width="5" height="91" rx="2" fill="#15803d"/><text x="65" y="824" font-family="sans-serif" font-size="16" font-weight="700" fill="#15803d">Include recommendations</text><text x="65" y="864" font-family="sans-serif" font-size="32" font-weight="700" fill="#172b4d">21</text><text x="65" y="888" font-family="sans-serif" font-size="13" fill="#475569">Eligibility supported</text><rect x="310" y="795" width="245" height="125" rx="14" fill="#fffbeb" stroke="#b45309" stroke-opacity="0.35"/><rect x="310" y="812" width="5" height="91" rx="2" fill="#b45309"/><text x="330" y="824" font-family="sans-serif" font-size="16" font-weight="700" fill="#b45309">Decision pending</text><text x="330" y="864" font-family="sans-serif" font-size="32" font-weight="700" fill="#172b4d">16</text><text x="330" y="888" font-family="sans-serif" font-size="13" fill="#475569">Retained provisionally</text><path d="M300,725 L167,785" fill="none" stroke="#94a3b8" stroke-width="2"/><polygon points="167.00,785.00 176.85,784.95 173.56,777.65" fill="#94a3b8"/><path d="M300,725 L432,785" fill="none" stroke="#94a3b8" stroke-width="2"/><polygon points="432.00,785.00 425.46,777.63 422.15,784.92" fill="#94a3b8"/><path d="M167,925 L280,970" fill="none" stroke="#94a3b8" stroke-width="2"/><polygon points="280.00,970.00 273.12,962.95 270.16,970.39" fill="#94a3b8"/><path d="M432,925 L320,970" fill="none" stroke="#94a3b8" stroke-width="2"/><polygon points="320.00,970.00 329.84,970.36 326.86,962.93" fill="#94a3b8"/><rect x="45" y="985" width="510" height="110" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-opacity="0.35"/><rect x="45" y="1002" width="5" height="76" rx="2" fill="#0f766e"/><text x="65" y="1014" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f766e">Evidence extracted</text><text x="65" y="1054" font-family="sans-serif" font-size="32" font-weight="700" fill="#172b4d">36</text><text x="65" y="1078" font-family="sans-serif" font-size="13" fill="#475569">Reports with usable source evidence</text><rect x="655" y="985" width="300" height="110" rx="14" fill="#fffbeb" stroke="#b45309" stroke-opacity="0.35"/><rect x="655" y="1002" width="5" height="76" rx="2" fill="#b45309"/><text x="675" y="1014" font-family="sans-serif" font-size="16" font-weight="700" fill="#b45309">Without usable extraction</text><text x="675" y="1054" font-family="sans-serif" font-size="32" font-weight="700" fill="#172b4d">1</text><text x="675" y="1078" font-family="sans-serif" font-size="13" fill="#475569">Retained report; not an exclusion</text><text x="655" y="834" font-family="sans-serif" font-size="16" font-weight="700" fill="#172b4d">How to read this diagram</text><text x="655" y="866" font-family="sans-serif" font-size="14" fill="#475569">Amber means a decision or access</text><text x="655" y="888" font-family="sans-serif" font-size="14" fill="#475569">gap remains. It is not an exclusion.</text><text x="655" y="928" font-family="sans-serif" font-size="14" fill="#475569">Extracted evidence can remain</text><text x="655" y="950" font-family="sans-serif" font-size="14" fill="#475569">provisional pending eligibility.</text><text x="45" y="1135" font-family="sans-serif" font-size="13" fill="#475569">Counts describe reports; independent study counts require confirmation. Reporting does not certify PRISMA compliance.</text><text x="45" y="1160" font-family="sans-serif" font-size="12" fill="#64748b">Adapted from the PRISMA 2020 flow diagram · prisma-statement.org · CC BY 4.0</text></svg>